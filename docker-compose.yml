version: "3.9"

services: 
    backend:
      build: ./AWS_storing
      container_name: music-backend
      ports:
        - "8000:8000"
      restart: always

    frontend:
      build:
        context: ./frontend
        args: 
          - REACT_APP_API_URL=http://backend:8000
      container_name: music-frontend
      ports:
        - "3000:80"
      depends_on:
        - backend
